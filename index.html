<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8" />

  <title>Akasi Khayyam — Restore</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* minimal reset */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}

    /* page background (simple, ensure it loads) */
    body{
      font-family: "Vazirmatn", system-ui, sans-serif;
      text-align:center;              /* keep text centered */
      margin:0;
      padding:2.5rem;
      background-color:#fafafa;
      background-image:
        linear-gradient(135deg, rgba(227,242,253,0.18), rgba(250,250,250,0.18)),
        url("Assets/Background-atmosphere.jpg");
      background-repeat:no-repeat;
      background-position:center;
      background-size:cover;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      overflow-y:auto;                /* allow natural scrolling */
    }

    /* content sits above decorative images */
    .content{
      position:relative;
      z-index:2000;                   /* ensure visibility above brand image */
      max-width:720px;
      margin:0 auto;
      direction:rtl;
      padding-top:1.5rem;
      padding-bottom:4.5rem;          /* safe space under links */
    }

    h1{ font-family:'Amiri',serif; font-weight:800; font-size:clamp(2rem,4.2vw,3.8rem); color:#222; margin-bottom:1rem}

    ul{ list-style:none; margin-top:.6rem }
    li{ margin: .9rem 0 }
    a{
      display:inline-block;
      text-decoration:none;
      color:#0366d6;
      background:rgba(255,255,255,0.7);
      padding:.36rem .6rem;
      border-radius:6px;
      font-size:clamp(.95rem,1.6vw,1.15rem);
      font-family:'Noto Nastaliq Urdu',sans-serif;
    }

    /* centered decorative brand image — small and restrained */
    .brand-logo{
      display: block;
      margin: 4rem auto 0 auto;  /* push it down after text */
      width: 30vw;
      max-width: 200px;
      height: auto;
      object-fit: cover;
      opacity: 0.98;
      /* display: fixed;
      left:50%;
      top:75vh;                          
      transform:translate(-50%);
      width:30vw;                       
      max-width:200px;                 
      max-height:30vh;                  
      object-fit:cover;
      height:auto;
      z-index:1000;                     
      pointer-events:none;
      opacity:.98; */
    }

    .contact-box{
  margin: 1.5rem auto 0 auto;
  padding: 1rem 1.4rem;
  max-width: 340px;

  background: rgba(255,255,255,0.65);
  backdrop-filter: blur(6px);

  border: 1px solid rgba(255,255,255,0.5);
  border-radius: 12px;

  box-shadow: 0 8px 25px rgba(0,0,0,0.08);

  font-size: 0.95rem;
  line-height: 1.9;
  color: #222;
}

.contact-box p{
  margin: 0.2rem 0;
}


    /* bottom-right logo */
    .bottom-logo{
      position:fixed;
      right:1rem;
      bottom:1rem;
      width:18vw;
      max-width:120px;
      height:auto;
      z-index:2200;
      pointer-events:none;
    }

    /* small-screen tweaks */
    @media (max-width:520px){
      .brand-logo{ width:48vw; max-width:160px; height:auto; margin:1.5rem auto 0 auto; } /* still centered */
      .bottom-logo{ display:block; width:22vw; max-width:100px }
      body{ padding:1rem }
      .content{ padding-bottom: calc( var(--safe,4.5rem) ) }
    }
  </style>
</head>
<body>
  <div class="content">
    <h1> مجموعه عکاسی خیام </h1>
    <ul>

      <li><a href="https://ble.ir/khayyam_photostudio" target="_blank" rel="noopener">Bale - پیام رسان بله </a></li>

     <img src="Assets/Brand-Logo.png" alt="Khayyam Logo" class="brand-logo" />
